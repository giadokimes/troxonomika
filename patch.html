<script type="application/json" id="cssappend">"\n/* ---- v30: αναδιοργάνωση φόρμας ---- */\n#pasteBlock { margin: 0 0 16px; }\n#pasteBlock .btn { width: 100%; }\n.adv > label.full { margin-top: 12px; }\n.pinhint { font-size: 12px; color: var(--mut); margin: 6px 0 2px; line-height: 1.45; }\n.fsec { margin: 12px 0 2px; padding-top: 12px; border-top: 1px solid var(--line); }\n.fsec b { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink); }\n.grid > .fsec:first-child { border-top: 0; padding-top: 0; margin-top: 0; }\n"</script>
<script>
var PAIRS=JSON.parse(document.getElementById('pairs').textContent);
var OLD_DLG=JSON.parse(document.getElementById('olddlg').textContent);
var NEW_DLG=JSON.parse(document.getElementById('newdlg').textContent);
var CSS_APPEND=JSON.parse(document.getElementById('cssappend').textContent);
function st(m,ok){var e=document.getElementById('st');e.textContent=m;e.style.color=ok?'#0a7d28':(ok===false?'#b00020':'#333');}
function dl(n,t){var b=new Blob([t],{type:'text/plain;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1500);}
function base(){return document.getElementById('base').value.trim().replace(/\/?$/,'/');}
function cnt(s,x){return s.split(x).length-1;}
async function ft(n){var r=await fetch(base()+n,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+n);return await r.text();}
async function patchApp(){st('Φόρτωση app.js…');try{
  var p=document.getElementById('pasteApp').value; var src=(p&&p.length>5000)?p:await ft('app.js');
  var errs=[];for(var i=0;i<PAIRS.length;i++){var c=cnt(src,PAIRS[i][0]);if(c!==1)errs.push('#'+(i+1)+'('+c+')');}
  if(errs.length){st('ΔΕΝ εφαρμόστηκε: '+errs.join(', ')+' (ίσως ήδη ενημερωμένο). Τίποτα δεν άλλαξε.',false);return;}
  for(var j=0;j<PAIRS.length;j++){src=src.replace(PAIRS[j][0],PAIRS[j][1]);}
  dl('app.js',src);st('ΟΚ! Κατέβηκε το νέο app.js (31 αλλαγές, λογότυπο ανέπαφο). Ανέβασέ το.',true);
}catch(e){st('Σφάλμα: '+e.message+'. Δοκίμασε την επικόλληση στο πλαίσιο κάτω.',false);}}
async function patchIndex(){st('Φόρτωση index.html…');try{
  var s=await ft('index.html');var c=cnt(s,OLD_DLG);
  if(c!==1){st('index.html: η φόρμα δεν βρέθηκε ακριβώς 1 φορά ('+c+'). Ίσως ήδη ενημερωμένο. Δεν άλλαξε.',false);return;}
  s=s.replace(OLD_DLG,NEW_DLG);dl('index.html',s);st('ΟΚ! Κατέβηκε το νέο index.html. Ανέβασέ το.',true);
}catch(e){st('Σφάλμα index.html: '+e.message,false);}}
async function patchCss(){st('Φόρτωση style.css…');try{var s=await ft('style.css');if(s.indexOf('v30: αναδιοργάνωση')===-1)s=s+CSS_APPEND;dl('style.css',s);st('ΟΚ! Κατέβηκε το νέο style.css. Ανέβασέ το.',true);}catch(e){st('Σφάλμα style.css: '+e.message,false);}}
async function patchSw(){st('Φόρτωση sw.js…');try{var s=await ft('sw.js');s=s.replace(/troxonomika-v\d+-light/,'troxonomika-v12-light');dl('sw.js',s);st('ΟΚ! Κατέβηκε το νέο sw.js (cache v12). Ανέβασέ το.',true);}catch(e){st('Σφάλμα sw.js: '+e.message,false);}}
</script>
