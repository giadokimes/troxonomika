<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Διαχείριση Υποθέσεων</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>

<header>
    <button class="hb" id="btnBack" hidden aria-label="Πίσω">←</button>
    <div>
        <h1 id="viewTitle">Σήμερα</h1>
        <div class="hsub" id="viewSub"></div>
    </div>
    <div class="top">
        <button class="btn-top" data-nav="menu">Μενού</button>
    </div>
</header>

<div class="backup-warning" id="backupWarning" hidden>
    <span>Έχουν περάσει 7 ημέρες από το τελευταίο Backup. Κάντε λήψη από το Μενού.</span>
    <button onclick="this.parentElement.style.display='none'">X</button>
</div>

<main>
    <div id="view-today" class="view">
        <div class="tools">
            <input type="search" id="searchInput" placeholder="Αναζήτηση (Πινακίδα, Όνομα, Φάκελος...)">
        </div>
        <div id="todayList"></div>
    </div>

    <div id="view-cases" class="view" hidden>
        <div class="tools">
            <input type="search" id="searchInputCases" placeholder="Αναζήτηση..." oninput="document.getElementById('searchInput').value=this.value; q=this.value; render();">
            <div class="lbl">Φίλτρα</div>
            <div class="chips">
                <button class="chip" data-filter="state" id="fsState">Φάση: Όλες</button>
                <button class="chip" data-filter="folder" id="fsFolder">Φάκελος: Όλοι</button>
                <button class="chip" data-filter="inv" id="fsInv">Προσκλήσεις: Όλες</button>
                <button class="chip ghost" data-clearf id="btnClearF" hidden>Καθαρισμός</button>
            </div>
        </div>
        <div id="casesList"></div>
    </div>

    <div id="view-menu" class="view" hidden>
        <div class="menu">
            <div class="mrow">
                <b>Αντίγραφο Ασφαλείας (Backup)</b>
                <span id="lastBackup">Δεν έχει γίνει ακόμα</span>
                <div style="display:flex; gap:8px; margin-top:8px; width:100%">
                    <button class="btn pri" id="btnExport" style="flex:1">Λήψη JSON</button>
                    <button class="btn ghost" id="btnImport" style="flex:1">Επαναφορά</button>
                    <input type="file" id="importFile" accept=".json" hidden>
                </div>
            </div>
            <div class="mrow">
                <b>Εκτύπωση Λίστας</b>
                <span>A4 οριζόντια, για αρχείο</span>
                <button class="btn ghost" id="btnPrint" style="margin-top:8px; width:100%">Εκτύπωση</button>
            </div>
            <div class="msum" id="menuSum"></div>
        </div>
    </div>

    <div id="view-case" class="view" hidden>
        <div id="caseBody"></div>
    </div>
</main>

<button class="fab" id="btnNew" aria-label="Νέα υπόθεση">+</button>

<nav class="nav">
    <button data-nav="today" class="on">
        <span>Σήμερα</span>
        <i class="nb" id="nbToday" hidden>0</i>
    </button>
    <button data-nav="cases">
        <span>Υποθέσεις</span>
    </button>
    <button data-nav="menu">
        <span>Μενού</span>
    </button>
</nav>

<dialog id="dlgForm">
    <div class="dlg">
        <h2 id="formTitle">Νέα Υπόθεση</h2>
        <form id="caseForm">
            <div class="grid">
                <label>Πινακίδα * <input type="text" name="plate" id="plate" required autocomplete="off"></label>
                <div class="warn-text" id="plateWarning" hidden></div>
                
                <label class="full">Ονοματεπώνυμο * <input type="text" name="name" id="name" required></label>
                
                <label>Αριθ. Πρωτοκόλλου
                    <div style="display:flex; gap:6px;">
                        <select name="protocolPrefix" id="protocolPrefix" style="flex:0 0 110px;">
                            <option value="">— επιλογή —</option>
                        </select>
                        <input type="text" name="protocolNum" id="protocolNum" placeholder="Αριθμός" style="flex:1;">
                    </div>
                </label>
                <input type="hidden" name="protocol" id="protocol">

                <label>Διεύθυνση κατοικίας <input type="text" name="address" id="address"></label>
                
                <label>Υπηρεσία παράβασης 
                    <input type="text" name="service" id="service" list="serviceList" autocomplete="off">
                    <datalist id="serviceList"></datalist>
                </label>

                <label>Τηλέφωνο <input type="tel" name="phone" id="phone"></label>
                <label>Ημ. Παραλαβής * <input type="date" name="receivedDate" id="receivedDate" required></label>

                <label>Θέση Φακέλου
                    <select name="folderSelect" id="fFolder"></select>
                </label>
                <label id="fFolderCustomWrap" hidden>Νέος Φάκελος <input type="text" name="folderCustom" id="folderCustom"></label>

                <label>Είδος Παράβασης
                    <select name="violationType" id="fViol">
                        <option value="">— επιλογή —</option>
                        <option value="Υπερβολική ταχύτητα">Υπερβολική ταχύτητα</option>
                        <option value="ΚΤΕΟ">ΚΤΕΟ</option>
                        <option value="Διόδια">Διόδια</option>
                        <option value="Στάθμευση">Στάθμευση</option>
                        <option value="Απόφαση">Απόφαση</option>
                        <option value="custom">Άλλο (ελεύθερο κείμενο)...</option>
                    </select>
                </label>
                <label id="fViolCustomWrap" hidden>Περιγραφή <input type="text" name="violationOther" id="violOther"></label>

                <label>Πρόστιμο (€) <input type="number" step="0.01" name="fine" id="fine"></label>
                <label>Ημέρες αφαίρεσης <input type="number" name="removalDays" id="removalDays" min="0"></label>
                
                <label class="full">Παρατηρήσεις <textarea name="notes" id="notes" rows="3"></textarea></label>

                <details class="adv full">
                    <summary>Προχωρημένη Διόρθωση (Κατάσταση & Ημερομηνίες)</summary>
                    <div class="grid" style="margin-top:12px;">
                        <label>Χειροκίνητη Κατάσταση
                            <select name="manualState" id="manualState"></select>
                        </label>
                    </div>
                </details>
            </div>

            <div class="acts">
                <button type="button" class="btn ghost" id="btnFormCancel">Άκυρο</button>
                <button type="button" class="btn bad" id="btnFormDelete" hidden>Διαγραφή</button>
                <button type="button" class="btn ghost" id="btnGenInv">Δημιουργία πρόσκλησης .doc</button>
                <button type="submit" class="btn pri">Αποθήκευση</button>
            </div>
        </form>
    </div>
</dialog>

<dialog id="dlgWizard">
    <div class="dlg">
        <h2 id="wT"></h2>
        <p class="muted" id="wD"></p>
        <div id="wB"></div>
        <div class="acts" id="wA"></div>
    </div>
</dialog>

<dialog id="dlgPick">
    <div class="dlg">
        <h2 id="pickT"></h2>
        <div class="pick" id="pickB"></div>
        <div class="acts col" style="margin-top:16px;">
            <button class="btn ghost" onclick="document.getElementById('dlgPick').close()">Άκυρο</button>
        </div>
    </div>
</dialog>

<dialog id="dlgHistory">
    <div class="dlg">
        <h2>Ιστορικό Ενεργειών</h2>
        <div class="hist" id="histBody"></div>
        <div class="acts col" style="margin-top:16px;">
            <button class="btn ghost" id="btnHistoryClose">Κλείσιμο</button>
        </div>
    </div>
</dialog>

<div id="printArea"></div>
<script src="./app.js"></script>
</body>
</html>
