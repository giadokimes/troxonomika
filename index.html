<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Διαχείριση Υποθέσεων</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <button class="hb" id="btnBack" data-back hidden aria-label="Πίσω"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1 id="viewTitle">Σήμερα</h1>
  <span class="hsub" id="viewSub"></span>
</header>

<div id="backupWarning" class="backup-warning" style="display:none;">
  <span>Έχουν περάσει 7 ημέρες από το τελευταίο Backup. Κάντε λήψη από το Μενού.</span>
  <button onclick="document.getElementById('backupWarning').style.display='none'">X</button>
</div>

<main>
  <section class="view" id="view-today"><div id="todayList"></div></section>

  <section class="view" id="view-cases" hidden>
    <div class="tools2">
      <button class="btn pri newbar" id="btnNew">+ Νέα υπόθεση</button>
      <input type="search" id="searchInput" placeholder="Πινακίδα, όνομα, τηλέφωνο, ημερομηνία" autocomplete="off">
      <div class="fbar">
        <button class="fsel" data-filter="state"><small>Φάση</small><span id="fsState">Όλες</span></button>
        <button class="fsel" data-filter="folder"><small>Φάκελος</small><span id="fsFolder">Όλοι</span></button>
        <button class="fsel" data-filter="inv"><small>Προσκλήσεις</small><span id="fsInv">Όλες</span></button>
      </div>
      <button class="linkbtn" data-clearf id="btnClearF" hidden>Καθαρισμός φίλτρων</button>
    </div>
    <div id="casesList"></div>
  </section>

  <section class="view" id="view-menu" hidden>
    <div class="menu">
      <button class="mrow" id="btnExport"><b>Backup</b><span id="lastBackup"></span></button>
      <button class="mrow" id="btnImport"><b>Επαναφορά από αρχείο</b><span>Αντικαθιστά τις τρέχουσες υποθέσεις</span></button>
      <button class="mrow" id="btnPrint"><b>Εκτύπωση λίστας</b><span>A4 οριζόντια</span></button>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
      <div class="msum" id="menuSum"></div>
    </div>
  </section>

  <section class="view" id="view-case" hidden><div id="caseBody"></div></section>
</main>

<nav class="nav">
  <button data-nav="today" class="on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><i class="nb" id="nbToday" hidden></i><span>Σήμερα</span></button>
  <button data-nav="cases"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Υποθέσεις</span></button>
  <button data-nav="menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Μενού</span></button>
</nav>

<!-- Modal Φόρμας -->
<dialog id="dlgForm">
  <form id="caseForm" class="dlg">
    <h2 id="formTitle">Νέα Υπόθεση</h2>
    <div class="grid">
      <div class="full">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn pri sm" id="btnScan">Σάρωση εγγράφου (φωτογραφία)</button>
          <button type="button" class="btn ghost sm" id="btnPaste">Επικόλληση κειμένου</button>
          <button type="button" class="btn ghost sm" id="btnCopyOcr" hidden>Αντιγραφή κειμένου OCR</button>
        </div>
        <input type="file" id="scanFile" accept="image/*" hidden>
        <div id="scanMsg" class="muted" hidden style="white-space:pre-line;margin-top:6px"></div>
      </div>
      <label class="full">Πινακίδα *
        <input name="plate" required autocomplete="off" style="text-transform:uppercase">
        <div id="plateWarning" class="warn-text" style="display:none;"></div>
      </label>
      <label class="full">Ονοματεπώνυμο *<input name="name" required autocomplete="off" placeholder="ΕΠΩΝΥΜΟ ΟΝΟΜΑ"></label>
      <label class="full">Υπηρεσία παράβασης<input name="service" list="serviceList" autocomplete="off" placeholder="π.χ. ΥΔΝΣΗ ή ΤΤ ΛΗΤΗΣ"></label>
      <label>Τηλέφωνο<input name="phone" type="tel"></label>
      <label>Ημ. Παραλαβής *<input type="date" name="receivedDate" required></label>
      <label class="full">Αρ. πρωτοκόλλου
        <div class="two"><select name="protocolPrefix"></select><input name="protocolNum" inputmode="numeric" autocomplete="off" placeholder="τελικό νούμερο, π.χ. 451"></div>
      </label>
      <label class="full">Διεύθυνση κατοικίας<input name="address" autocomplete="off" placeholder="π.χ. Κυρίλλου και Μεθοδίου 07"></label>
      <div class="full"><button type="button" class="btn ghost sm" id="btnGenInv">Δημιουργία πρόσκλησης (αρχείο Word) από τα στοιχεία της φόρμας</button></div>
      <label>Θέση Φακέλου<select name="folderSelect" id="fFolder"></select></label>
      <label class="full" id="fFolderCustomWrap" hidden>Νέος Φάκελος<input name="folderCustom"></label>
      <label class="full">Είδος Παράβασης
        <select name="violationType" id="fViol">
          <option value="">—</option>
          <option>Υπερβολική ταχύτητα</option>
          <option>ΚΤΕΟ</option>
          <option>Διόδια</option>
          <option>Στάθμευση</option>
          <option>Απόφαση</option>
          <option>Παραλαβή εγγράφου</option>
          <option value="custom">Άλλο (ελεύθερο κείμενο)...</option>
        </select>
      </label>
      <label class="full" id="fViolCustomWrap" hidden>Περιγραφή<input name="violationOther"></label>
      <label>Πρόστιμο (€)<input type="number" name="fine" min="0" step="0.01"></label>
      <label>Ημέρες αφαίρεσης<input type="number" name="removalDays" min="1" placeholder="π.χ. 30"></label>
      <label class="full">Προς αφαίρεση
        <select name="removalWhat">
          <option value="license">Δίπλωμα</option>
          <option value="plates">Άδεια κυκλοφορίας και πινακίδες</option>
          <option value="both">Δίπλωμα, άδεια κυκλοφορίας και πινακίδες</option>
          <option value="foreign">Δίπλωμα εξωτερικού (χωρίς POL)</option>
        </select>
      </label>
      <label class="full">Παρατηρήσεις<textarea name="notes" rows="2"></textarea></label>
    </div>

    <details class="adv">
      <summary>Προχωρημένη Διόρθωση (Κατάσταση & Ημερομηνίες)</summary>
      <label class="full" hidden>Χειροκίνητη Κατάσταση<select name="manualState"></select></label>
      <div class="grid">
        <div class="full eds"><b>Κλήσεις</b><div id="callRows"></div><button type="button" class="btn ghost sm" id="addCall">Προσθήκη κλήσης</button></div>
        <div class="full eds"><b>Ραντεβού</b><div id="apptRows"></div><button type="button" class="btn ghost sm" id="addAppt">Προσθήκη ραντεβού</button></div>
        <label>Βρέθηκε τηλέφωνο<input type="date" name="d_searchFound"></label>
        <label>Δεν βρέθηκε τηλέφωνο<input type="date" name="d_searchNone"></label>
        <label>1η Δημιουργία<input type="date" name="d_inv1Create"></label>
        <label>1η Αποστολή<input type="date" name="d_inv1Send"></label>
        <label>1ο Αποδεικτικό<input type="date" name="d_inv1Proof"></label>
        <label>1ο Αποδεικτικό: αποτέλεσμα<select name="d_inv1Res"><option value="">—</option><option value="ok">Βρέθηκε ή μένει εκεί</option><option value="bad">Λάθος διεύθυνση ή δεν μένει εκεί</option></select></label>
        <label>2η Δημιουργία<input type="date" name="d_inv2Create"></label>
        <label>2η Αποστολή<input type="date" name="d_inv2Send"></label>
        <label>2ο Αποδεικτικό<input type="date" name="d_inv2Proof"></label>
        <label>2ο Αποδεικτικό: αποτέλεσμα<select name="d_inv2Res"><option value="">—</option><option value="ok">Βρέθηκε ή μένει εκεί</option><option value="bad">Λάθος διεύθυνση ή δεν μένει εκεί</option></select></label>
        <label>3η Δημιουργία<input type="date" name="d_inv3Create"></label>
        <label>3η Αποστολή<input type="date" name="d_inv3Send"></label>
        <label>3ο Αποδεικτικό<input type="date" name="d_inv3Proof"></label>
        <label>3ο Αποδεικτικό: αποτέλεσμα<select name="d_inv3Res"><option value="">—</option><option value="ok">Βρέθηκε ή μένει εκεί</option><option value="bad">Λάθος διεύθυνση ή δεν μένει εκεί</option></select></label>
        <label>Αφαίρεση<input type="date" name="d_susp"></label>
        <label>Λήξη αφαίρεσης (auto)<input type="date" name="d_return" readonly></label>
        <label>POL αφαίρεσης<input type="date" name="d_polRem"></label>
        <label>Απόδοση<input type="date" name="d_returned"></label>
        <label>POL απόδοσης<input type="date" name="d_polRet"></label>
        <label>Παραλαβή εγγράφου (χωρίς αφαίρεση)<input type="date" name="d_docRecv"></label>
        <label>Εκτός αρμοδιότητας (ημερομηνία)<input type="date" name="d_oos"></label>
        <label>Υπηρεσία προορισμού<input type="text" name="d_oosDest" list="serviceList" autocomplete="off"></label>
        <label class="full">Αιτιολογία<input type="text" name="d_oosReason" autocomplete="off"></label>
        <label>Υποβολή μήνυσης<input type="date" name="d_complaint"></label>
        <label>Κλείσιμο υπόθεσης<input type="date" name="d_closed"></label>
        <label>Είδος κλεισίματος<select name="d_closedKind"><option value="">—</option><option value="transmittal">Διαβιβαστικό</option><option value="complaint">Μήνυση</option></select></label>
      </div>
    </details>

    <details class="adv">
      <summary>Στοιχεία παράβασης (για την πρόσκληση) και τέλος διαδικασίας</summary>
      <div class="grid">
        <label>Ημερομηνία παράβασης<input type="date" name="vDate"></label>
        <label>Άρθρο<input name="vArticle" autocomplete="off" placeholder="π.χ. 24§9αγ"></label>
        <label class="full">Τόπος παράβασης<input name="vPlace" autocomplete="off" placeholder="π.χ. 39+370 χ/θ της Π.Ε.Ο. Λάρισας - Βόλου"></label>
        <label class="full">Τέλος διαδικασίας
          <select name="endRoute">
            <option value="">Κατά τον κανόνα (απλή κλήση: διαβιβαστικό, απόφαση: μήνυση)</option>
            <option value="complaint">Μήνυση (το ζητά το έγγραφο)</option>
            <option value="transmittal">Διαβιβαστικό</option>
          </select>
        </label>
      </div>
    </details>

    <div class="acts">
      <button type="button" class="btn ghost" id="btnFormCancel">Άκυρο</button>
      <button type="button" class="btn bad" id="btnFormDelete" hidden>Διαγραφή</button>
      <button type="submit" class="btn pri">Αποθήκευση</button>
    </div>
  </form>
</dialog>
<datalist id="serviceList"></datalist>
<div id="undoBar" hidden><span></span><button type="button">Αναίρεση</button></div>

<!-- Modal Wizard (Βήμα-Βήμα Ενέργειες) -->
<dialog id="dlgWizard">
  <div class="dlg">
    <h2 id="wT"></h2>
    <p id="wD" class="muted"></p>
    <div id="wB"></div>
    <div class="acts col" id="wA"></div>
  </div>
</dialog>

<!-- Modal Ιστορικού -->
<dialog id="dlgHistory">
  <div class="dlg">
    <h2>Ιστορικό Ενεργειών</h2>
    <div id="histBody" class="hist"></div>
    <div class="acts">
      <button type="button" class="btn ghost" id="btnHistoryClose">Κλείσιμο</button>
    </div>
  </div>
</dialog>

<!-- Επιλογή φίλτρου -->
<dialog id="dlgPick">
  <div class="dlg">
    <h2 id="pickT"></h2>
    <div id="pickB" class="pick"></div>
    <div class="acts"><button type="button" class="btn ghost" onclick="document.getElementById('dlgPick').close()">Κλείσιμο</button></div>
  </div>
</dialog>

<section id="printArea"></section>
<script src="./ocr-parser.js"></script>
<script src="./ocr-scan.js"></script>
<script src="./app.js"></script>
</body>
</html>
