<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Φάκελοι Υποθέσεων</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--mut:#5d6b7c;--pri:#1e3a5f;--red:#c62828;--amb:#d98200;--grn:#2e7d32;--line:#d9dfe7;--r:12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:1.15rem}
.bar{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;border:0;border-radius:8px;padding:9px 12px;background:#fff;color:var(--pri);font-weight:600;cursor:pointer}
button.p{background:var(--pri);color:#fff}button.d{background:var(--red);color:#fff}
header .bar button{padding:7px 10px;font-size:.9rem}
#q{width:100%;margin-top:8px;padding:11px;border:0;border-radius:8px;font:inherit}
main{max-width:900px;margin:0 auto;padding:10px 12px 90px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500;border-radius:99px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;border-left:6px solid var(--line);box-shadow:0 1px 3px #0002}
.card.late{border-left-color:var(--red);background:#fdecea}
.card.today{border-left-color:var(--amb)}
.card.done{border-left-color:var(--grn);opacity:.8}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:1.05rem}.mut{color:var(--mut);font-size:.88rem}
.st{font-size:.78rem;font-weight:700;background:#e6ecf3;color:var(--pri);border-radius:6px;padding:3px 8px;white-space:nowrap}
.loc{background:#fff0b3;border:2px solid #d4a300;border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:800;font-size:1.05rem}
.loc small{display:block;font-weight:600;color:#6b5600;font-size:.72rem;letter-spacing:.04em}
.next{font-weight:600}.late .next{color:var(--red)}.today .next{color:var(--amb)}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.acts button{background:#e6ecf3;font-size:.85rem;padding:7px 10px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);width:58px;height:58px;border-radius:50%;font-size:2rem;line-height:1;background:var(--pri);color:#fff;box-shadow:0 3px 8px #0005;padding:0}
dialog{border:0;border-radius:var(--r);padding:0;width:min(560px,96vw);max-height:94vh}
dialog::backdrop{background:#0008}
form{padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
form h2{grid-column:1/-1;margin:0;font-size:1.1rem}
label{font-size:.8rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:3px}
label.w,.fa{grid-column:1/-1}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;width:100%;color:var(--ink);background:#fff}
.fa{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#printArea{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 body{background:#fff;font-size:10pt}
 table{width:100%;border-collapse:collapse}
 th,td{border:1px solid #444;padding:3px 5px;text-align:left;vertical-align:top;font-size:9pt}
 th{background:#ddd}tr{page-break-inside:avoid}
 h2{margin:0 0 6px;font-size:13pt}
}
</style>
</head>
<body>
<header>
 <h1>Φάκελοι Υποθέσεων</h1>
 <div class="bar">
  <button id="bPrint">Εκτύπωση</button>
  <button id="bExp">Εξαγωγή</button>
  <button id="bImp">Εισαγωγή</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
 </div>
 <input id="q" type="search" placeholder="Αναζήτηση: όνομα, πινακίδα, φάκελος, ημερομηνία (π.χ. 12/03)" autocomplete="off">
</header>
<main><div id="chips"></div><div id="list"></div></main>
<button id="fab" aria-label="Νέα υπόθεση">+</button>

<dialog id="dlg">
<form id="f" method="dialog">
 <h2 id="ft">Νέα υπόθεση</h2>
 <input type="hidden" id="id">
 <label class="w">Ονοματεπώνυμο<input id="name" required></label>
 <label>Πινακίδα / Αρ. υπόθεσης<input id="plate" autocapitalize="characters"></label>
 <label>Ημ. παραλαβής<input type="date" id="received" required></label>
 <label class="w">Θέση φακέλου<input id="folder" list="folders" placeholder="π.χ. Ντουλάπι Α - Ράφι 2" autocomplete="off" required></label>
 <datalist id="folders"></datalist>
 <label>Κατάσταση<select id="status"></select></label>
 <label>Τηλέφωνο<input id="phone" type="tel"></label>
 <label>Ημ. επικοινωνίας<input type="date" id="contact"></label>
 <label>Ημ. προσέλευσης<input type="date" id="arrival"></label>
 <label>1η πρόσκληση<input type="date" id="i1"></label>
 <label>2η πρόσκληση<input type="date" id="i2"></label>
 <label>3η πρόσκληση<input type="date" id="i3"></label>
 <label class="w">Σημειώσεις<textarea id="notes" rows="3"></textarea></label>
 <div class="fa">
  <button type="button" class="d" id="del">Διαγραφή</button>
  <button type="button" id="cancel">Άκυρο</button>
  <button type="submit" class="p">Αποθήκευση</button>
 </div>
</form>
</dialog>

<div id="printArea"></div>

<script>
'use strict';
const KEY='troxonomika.v1';
const ST=['Προς αναζήτηση τηλεφώνου','Ενημερώθηκε','Δεν απάντησε','Δεν βρέθηκε τηλέφωνο','Εστάλη πρόσκληση','Προσήλθε'];
const $=s=>document.querySelector(s);
let cases=load(),filter='all',q='';

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(cases))}
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ς/g,'σ');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* Επόμενη ενέργεια */
function next(c){
 const inv=(c.inv||[]).filter(Boolean).sort(),n=inv.length;
 if(c.arrival)return{done:1,text:'Ολοκληρώθηκε',n};
 let text,due;
 if(c.status==='Ενημερώθηκε'){text='Αναμονή προσέλευσης';due=add(c.contact||c.received,10)}
 else if(n>=3){text='Και οι 3 προσκλήσεις εστάλησαν - έλεγχος';due=add(inv[2],15)}
 else if(n>0){text='Αποστολή '+(n+1)+'ης πρόσκλησης';due=add(inv[n-1],10)}
 else if(c.status===ST[0]){text='Αναζήτηση τηλεφώνου';due=c.received}
 else{text='Αποστολή 1ης πρόσκλησης';due=c.contact||c.received}
 return{text,due,n,late:diff(today(),due)};
}

/* Αναζήτηση */
const dates=c=>[c.received,c.contact,...(c.inv||[]),c.arrival].filter(Boolean).map(fmt);
const hay=c=>[c.name,c.plate,String(c.plate||'').replace(/[\s\-]/g,''),c.folder,c.notes,c.phone].map(norm).join(' ');
function match(c){
 const t=q.trim();if(!t)return true;
 const m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/);
 if(m){
  let s=m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0');
  if(m[3])s+='/'+(m[3].length===2?'20'+m[3]:m[3]);
  return dates(c).some(d=>d.startsWith(s));
 }
 const h=hay(c);
 if(norm(t).split(/\s+/).every(w=>h.includes(w)||h.includes(w.replace(/-/g,''))))return true;
 return /[\/]/.test(t)&&dates(c).some(d=>d.includes(t));
}

function passes(c,x){
 if(filter==='all')return true;
 if(filter==='late')return !x.done&&x.late>0;
 return c.status===filter;
}

function render(){
 const items=cases.map(c=>({c,x:next(c)}));
 const cnt=f=>items.filter(i=>f==='all'?1:f==='late'?(!i.x.done&&i.x.late>0):i.c.status===f).length;
 const fl=[['all','Όλες'],['late','Εκπρόθεσμες'],...ST.map(s=>[s,s])];
 $('#chips').innerHTML=fl.map(([k,l])=>`<button class="chip${filter===k?' on':''}" data-f="${esc(k)}">${esc(l)} (${cnt(k)})</button>`).join('');
 const vis=items.filter(i=>passes(i.c,i.x)&&match(i.c)).sort((a,b)=>{
  if(a.x.done!==b.x.done)return a.x.done?1:-1;
  if(a.x.done)return 0;
  return a.x.due<b.x.due?-1:a.x.due>b.x.due?1:0;
 });
 $('#list').innerHTML=vis.length?vis.map(({c,x})=>{
  let cls='',when='';
  if(!x.done){
   if(x.late>0){cls='late';when=`Εκπρόθεσμη κατά ${x.late} ημ. (${fmt(x.due)})`}
   else if(x.late===0){cls='today';when='Σήμερα'}
   else when=`Σε ${-x.late} ημ. (${fmt(x.due)})`;
  }else cls='done';
  const quick=!x.done&&/^Αποστολή \d/.test(x.text)&&x.n<3;
  return `<div class="card ${cls}" data-id="${c.id}">
   <div class="top"><div><div class="nm">${esc(c.name)}</div><div class="mut">${esc(c.plate||'-')} | Παραλαβή: ${fmt(c.received)}</div></div><span class="st">${esc(c.status)}</span></div>
   <div class="loc"><small>ΘΕΣΗ ΦΑΚΕΛΟΥ</small>${esc(c.folder||'-')}</div>
   <div class="next">${esc(x.text)}${when?' - '+esc(when):''}</div>
   ${c.phone?`<div class="mut">Τηλ: ${esc(c.phone)}</div>`:''}
   <div class="acts"><button data-act="edit">Επεξεργασία</button>${quick?'<button data-act="sent">Καταγραφή αποστολής σήμερα</button>':''}${c.phone?`<a class="btn" style="background:#e6ecf3;font-size:.85rem;padding:7px 10px;text-decoration:none" href="tel:${esc(c.phone)}">Κλήση</a>`:''}</div>
  </div>`;
 }).join(''):'<div class="empty">Καμία υπόθεση</div>';
}

/* Φόρμα */
const F=['id','name','plate','received','folder','status','phone','contact','arrival','notes'];
$('#status').innerHTML=ST.map(s=>`<option>${s}</option>`).join('');
function openForm(id){
 const c=cases.find(k=>k.id===id)||{};
 $('#ft').textContent=id?'Επεξεργασία υπόθεσης':'Νέα υπόθεση';
 F.forEach(k=>$('#'+k).value=c[k]||'');
 if(!id){$('#received').value=today();$('#status').value=ST[0]}
 [1,2,3].forEach(i=>$('#i'+i).value=(c.inv||[])[i-1]||'');
 $('#folders').innerHTML=[...new Set(cases.map(k=>k.folder).filter(Boolean))].sort().map(f=>`<option value="${esc(f)}">`).join('');
 $('#del').style.display=id?'':'none';
 $('#dlg').showModal();
}
$('#f').addEventListener('submit',e=>{
 e.preventDefault();
 const c={};F.forEach(k=>c[k]=$('#'+k).value.trim());
 c.inv=[$('#i1').value,$('#i2').value,$('#i3').value];
 if(c.arrival)c.status='Προσήλθε';else if(c.status==='Προσήλθε')c.arrival=today();
 if(c.id){cases=cases.map(k=>k.id===c.id?c:k)}else{c.id=uid();cases.push(c)}
 save();$('#dlg').close();render();
});
$('#cancel').onclick=()=>$('#dlg').close();
$('#del').onclick=()=>{if(confirm('Διαγραφή της υπόθεσης;')){cases=cases.filter(k=>k.id!==$('#id').value);save();$('#dlg').close();render()}};

/* Events */
$('#fab').onclick=()=>openForm();
$('#q').oninput=e=>{q=e.target.value;render()};
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}};
$('#list').onclick=e=>{
 const card=e.target.closest('.card'),b=e.target.closest('[data-act]');
 if(!card||e.target.closest('a'))return;
 const id=card.dataset.id;
 if(b&&b.dataset.act==='sent'){
  const c=cases.find(k=>k.id===id);
  const inv=(c.inv||['','','']).slice(0,3);
  while(inv.length<3)inv.push('');
  const i=inv.findIndex(v=>!v);
  if(i>-1){inv[i]=today();c.inv=inv;c.status='Εστάλη πρόσκληση';save();render()}
 }else openForm(id);
};

/* Εκτύπωση */
$('#bPrint').onclick=()=>{
 const rows=[...cases].sort((a,b)=>(a.folder||'').localeCompare(b.folder||'','el',{numeric:true}));
 $('#printArea').innerHTML=`<h2>Κατάσταση υποθέσεων - ${fmt(today())} (${rows.length})</h2><table><thead><tr><th>#</th><th>Ονοματεπώνυμο</th><th>Πινακίδα / Υπόθεση</th><th>Παραλαβή</th><th>Κατάσταση</th><th>Τηλέφωνο</th><th>Επικοινωνία</th><th>1η</th><th>2η</th><th>3η</th><th>Προσέλευση</th><th>Θέση φακέλου</th></tr></thead><tbody>${rows.map((c,i)=>{const v=c.inv||[];return `<tr><td>${i+1}</td><td>${esc(c.name)}</td><td>${esc(c.plate)}</td><td>${fmt(c.received)}</td><td>${esc(c.status)}</td><td>${esc(c.phone)}</td><td>${fmt(c.contact)}</td><td>${fmt(v[0])}</td><td>${fmt(v[1])}</td><td>${fmt(v[2])}</td><td>${fmt(c.arrival)}</td><td><b>${esc(c.folder)}</b></td></tr>`}).join('')}</tbody></table>`;
 window.print();
};

/* Backup / Restore */
$('#bExp').onclick=()=>{
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(cases,null,2)],{type:'application/json'}));
 a.download='ypotheseis-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d)||d.some(x=>!x||typeof x!=='object'||!x.name))throw 0;
   const rep=confirm(`Βρέθηκαν ${d.length} υποθέσεις.\nOK = αντικατάσταση όλων των τρεχόντων δεδομένων\nΆκυρο = συγχώνευση (ίδιο id αντικαθίσταται)`);
   d.forEach(x=>{x.id=x.id||uid();x.inv=x.inv||['','','']});
   if(rep)cases=d;else{const m=new Map(cases.map(c=>[c.id,c]));d.forEach(x=>m.set(x.id,x));cases=[...m.values()]}
   save();render();
  }catch(err){alert('Μη έγκυρο αρχείο backup.')}
  e.target.value='';
 };
 r.readAsText(f);
};

render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
 navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
