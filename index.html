<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Διαχείριση Υποθέσεων</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <h1>Υποθέσεις</h1>
  <div class="top">
    <button id="btnPrint" class="btn-top">Εκτύπωση</button>
    <button id="btnExport" class="btn-top">Backup</button>
    <button id="btnImport" class="btn-top">Επαναφορά</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</header>

<div id="backupWarning" class="backup-warning" style="display:none;">
  <span>Έχουν περάσει 7 ημέρες από το τελευταίο Backup. Παρακαλώ κάντε λήψη.</span>
  <button onclick="document.getElementById('backupWarning').style.display='none'">X</button>
</div>

<!-- Dashboard Στατιστικών -->
<div class="dashboard">
  <div class="stat">
    <strong id="statTotal">0</strong>
    <span>Ενεργές Υποθέσεις</span>
  </div>
  <div class="stat">
    <strong id="statDueToday">0</strong>
    <span>Ενέργειες Σήμερα</span>
  </div>
  <div class="stat">
    <strong id="statDueSoon">0</strong>
    <span>Προθεσμίες Σύντομα</span>
  </div>
  <div class="stat">
    <strong id="statWaiting">0</strong>
    <span>Σε Αναμονή</span>
  </div>
</div>

<div class="tools">
  <input type="search" id="searchInput" placeholder="Αναζήτηση: όνομα, πινακίδα, φάκελος..." autocomplete="off">
  
  <div class="lbl">Κατάσταση</div>
  <div class="chips" id="stateFilters"></div>
  
  <div class="lbl">Φάκελος</div>
  <div class="chips" id="folderFilters"></div>
</div>

<div id="banners" class="banners-container"></div>
<main id="casesList"></main>

<button class="fab" id="btnNew" aria-label="Νέα Υπόθεση">+</button>

<!-- Modal Φόρμας -->
<dialog id="dlgForm">
  <form id="caseForm" class="dlg">
    <h2 id="formTitle">Νέα Υπόθεση</h2>
    <div class="grid">
      <label class="full">Πινακίδα *
        <input name="plate" required autocomplete="off" style="text-transform:uppercase">
        <div id="plateWarning" class="warn-text" style="display:none;"></div>
      </label>
      <label class="full">Ονοματεπώνυμο *<input name="name" required autocomplete="off"></label>
      <label>Υπηρεσία<input name="service"></label>
      <label>Τηλέφωνο<input name="phone" type="tel"></label>
      <label>Ημ. Παραλαβής *<input type="date" name="receivedDate" required></label>
      <label>Θέση Φακέλου<select name="folderSelect" id="fFolder"></select></label>
      <label class="full" id="fFolderCustomWrap" hidden>Νέος Φάκελος<input name="folderCustom"></label>
      <label class="full">Είδος Παράβασης
        <select name="violationType" id="fViol">
          <option value="">—</option>
          <option>Υπερβολική ταχύτητα</option>
          <option>ΚΤΕΟ</option>
          <option>Διόδια</option>
          <option>Στάθμευση</option>
          <option>Απόφαση</option>
          <option value="custom">Άλλο (ελεύθερο κείμενο)...</option>
        </select>
      </label>
      <label class="full" id="fViolCustomWrap" hidden>Περιγραφή<input name="violationOther"></label>
      <label>Πρόστιμο (€)<input type="number" name="fine" min="0" step="0.01"></label>
      <label class="chk"><input type="checkbox" name="requiresLicense" id="fReq" checked> Αφαίρεση διπλώματος</label>
      <label class="full" id="fDaysWrap">Ημέρες Αφαίρεσης<input type="number" name="removalDays" min="1" value="30"></label>
      <label class="full">Παρατηρήσεις<textarea name="notes" rows="2"></textarea></label>
    </div>
    
    <details class="adv">
      <summary>Προχωρημένη Διόρθωση (Κατάσταση & Ημερομηνίες)</summary>
      <div class="grid">
        <label class="full">Χειροκίνητη Κατάσταση<select name="manualState"></select></label>
        <label>Τηλεφώνημα<input type="date" name="d_phone"></label>
        <label>Ραντεβού<input type="date" name="d_appt"></label>
        <label>Αφαίρεση<input type="date" name="d_susp"></label>
        <label>Απόδοση (auto)<input type="date" name="d_return" readonly></label>
        <label>1η Αποστολή<input type="date" name="d_inv1Send"></label>
        <label>1ο Αποδεικτικό<input type="date" name="d_inv1Proof"></label>
        <label>2η Αποστολή<input type="date" name="d_inv2Send"></label>
        <label>2ο Αποδεικτικό<input type="date" name="d_inv2Proof"></label>
        <label>3η Αποστολή<input type="date" name="d_inv3Send"></label>
        <label>3ο Αποδεικτικό<input type="date" name="d_inv3Proof"></label>
      </div>
    </details>

    <div class="acts">
      <button type="button" class="btn ghost" id="btnFormCancel">Άκυρο</button>
      <button type="button" class="btn bad" id="btnFormDelete" hidden>Διαγραφή</button>
      <button type="submit" class="btn pri">Αποθήκευση</button>
    </div>
  </form>
</dialog>

<!-- Modal Wizard (Βήμα-Βήμα Ενέργειες) -->
<dialog id="dlgWizard">
  <div class="dlg">
    <h2 id="wT"></h2>
    <p id="wD" class="muted"></p>
    <div id="wB"></div>
    <div class="acts col" id="wA"></div>
  </div>
</dialog>

<!-- Modal Ιστορικού -->
<dialog id="dlgHistory">
  <div class="dlg">
    <h2>Ιστορικό Ενεργειών</h2>
    <div id="histBody" class="hist"></div>
    <div class="acts">
      <button type="button" class="btn ghost" id="btnHistoryClose">Κλείσιμο</button>
    </div>
  </div>
</dialog>

<section id="printArea"></section>
<script src="./app.js"></script>
</body>
</html>
