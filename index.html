<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Διαχείριση Υποθέσεων</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <button class="hb" id="btnBack" data-back hidden aria-label="Πίσω"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1 id="viewTitle">Σήμερα</h1>
  <span class="hsub" id="viewSub"></span>
</header>

<div id="backupWarning" class="backup-warning" style="display:none;">
  <span>Έχουν περάσει 7 ημέρες από το τελευταίο Backup. Κάντε λήψη από το Μενού.</span>
  <button onclick="document.getElementById('backupWarning').style.display='none'">X</button>
</div>

<main>
  <section class="view" id="view-today"><div id="todayList"></div></section>

  <section class="view" id="view-cases" hidden>
    <div class="tools2">
      <button class="btn pri newbar" id="btnNew">+ Νέα υπόθεση</button>
      <input type="search" id="searchInput" placeholder="Πινακίδα, όνομα, τηλέφωνο, ημερομηνία" autocomplete="off">
      <div class="fbar">
        <button class="fsel" data-filter="state"><small>Φάση</small><span id="fsState">Όλες</span></button>
        <button class="fsel" data-filter="folder"><small>Φάκελος</small><span id="fsFolder">Όλοι</span></button>
        <button class="fsel" data-filter="inv"><small>Προσκλήσεις</small><span id="fsInv">Όλες</span></button>
      </div>
      <button class="linkbtn" data-clearf id="btnClearF" hidden>Καθαρισμός φίλτρων</button>
    </div>
    <div id="casesList"></div>
  </section>

  <section class="view" id="view-menu" hidden>
    <div class="menu">
      <button class="mrow" id="btnExport"><b>Backup</b><span id="lastBackup"></span></button>
      <button class="mrow" id="btnImport"><b>Επαναφορά από αρχείο</b><span>Αντικαθιστά τις τρέχουσες υποθέσεις</span></button>
      <button class="mrow" id="btnPrint"><b>Εκτύπωση λίστας</b><span>A4 οριζόντια</span></button>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>
      <div class="msum" id="menuSum"></div>
    </div>
  </section>

  <section class="view" id="view-case" hidden><div id="caseBody"></div></section>
</main>

<nav class="nav">
  <button data-nav="today" class="on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><i class="nb" id="nbToday" hidden></i><span>Σήμερα</span></button>
  <button data-nav="cases"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Υποθέσεις</span></button>
  <button data-nav="menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Μενού</span></button>
</nav>

<!-- Modal Φόρμας -->
<dialog id="dlgForm">
  <form id="caseForm" class="dlg">
    <h2 id="formTitle">Νέα Υπόθεση</h2>
    <div class="grid">
      <div class="form-heading full">Στοιχεία οχήματος και πολίτη</div>
      <label class="full">Πινακίδα *
        <input name="plate" required autocomplete="off" style="text-transform:uppercase">
        <div id="plateWarning" class="warn-text" style="display:none;"></div>
      </label>
      <label class="full">Ονοματεπώνυμο *<input name="name" required autocomplete="off" placeholder="π.χ. ΠΑΠΑΖΗΣΗ Γεώργιο του Ανδρέα"></label>
      <label class="full">Αριθ. Πρωτοκόλλου
        <div style="display:flex;gap:6px;align-items:center">
          <select name="protocolPrefix" id="protocolPrefix" style="flex:0 0 auto;min-width:140px">
            <option value="">— επιλογή —</option>
            <option value="2515/11-">2515/11-YY/</option>
            <option value="2517/4-">2517/4-YY/</option>
          </select>
          <input name="protocolNum" id="protocolNum" autocomplete="off" inputmode="numeric" maxlength="3" pattern="[0-9]{2,3}" placeholder="2 ή 3 ψηφία" style="flex:1">
        </div>
        <input type="hidden" name="protocol">
      </label>
      <label class="full">Διεύθυνση κατοικίας<input name="address" autocomplete="off" placeholder="π.χ. Κυρίλλου και Μεθοδίου 07"></label>
      <div class="form-heading full">Στοιχεία παράβασης</div>
      <label>Άρθρο Κ.Ο.Κ.<input name="violationArticle" autocomplete="off" placeholder="π.χ. 20 παρ. 3"></label>
      <label>Ημερομηνία παράβασης<input type="date" name="violationDate"></label>
      <label class="full">Τόπος παράβασης<input name="violationLocation" autocomplete="off" placeholder="Οδός / σημείο"></label>
      <label class="full">Υπηρεσία παράβασης
        <input name="service" list="serviceList" autocomplete="off" placeholder="Πληκτρολόγησε ή επίλεξε υπηρεσία">
        <datalist id="serviceList"></datalist>
      </label>
      <label>Τηλέφωνο<input name="phone" type="tel"></label>
      <label>Ημ. Παραλαβής *<input type="date" name="receivedDate" required></label>
      <label>Θέση Φακέλου<select name="folderSelect" id="fFolder"></select></label>
      <label class="full" id="fFolderCustomWrap" hidden>Νέος Φάκελος<input name="folderCustom"></label>
      <label class="full">Είδος Παράβασης
        <select name="violationType" id="fViol">
          <option value="">—</option>
          <option>Υπερβολική ταχύτητα</option>
          <option>ΚΤΕΟ</option>
          <option>Διόδια</option>
          <option>Στάθμευση</option>
          <option>Απόφαση</option>
          <option value="custom">Άλλο (ελεύθερο κείμενο)...</option>
        </select>
      </label>
      <label class="full" id="fViolCustomWrap" hidden>Περιγραφή<input name="violationOther"></label>
      <label>Πρόστιμο (€)<input type="number" name="fine" min="0" step="0.01"></label>
      <label class="full">Ημέρες αφαίρεσης (προαιρετικό)<input type="number" name="removalDays" min="1" placeholder="π.χ. 30"></label>
      <label class="full">Παρατηρήσεις<textarea name="notes" rows="2"></textarea></label>
    </div>
    
    <details class="adv">
      <summary>Προχωρημένη διόρθωση — κατάσταση και ημερομηνίες</summary>
      <div class="grid">
        <label class="full">Κατάσταση υπόθεσης<select name="manualState"></select><small>«Αυτόματη» ακολουθεί τις ημερομηνίες. Επιλέγοντας συγκεκριμένη κατάσταση, παραμένει χειροκίνητη μέχρι να επανέλθει στην αυτόματη.</small></label>
        <label>Τηλεφώνημα<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_phone" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_phone">×</button></div></label>
        <label>Ραντεβού<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_appt" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_appt">×</button></div></label>
        <label>Αφαίρεση<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_susp" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_susp">×</button></div></label>
        <label>Απόδοση (auto)<input type="date" name="d_return" readonly></label>
        <label>1η Αποστολή<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv1Send" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv1Send">×</button></div></label>
        <label>1ο Αποδεικτικό<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv1Proof" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv1Proof">×</button></div></label>
        <label>2η Αποστολή<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv2Send" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv2Send">×</button></div></label>
        <label>2ο Αποδεικτικό<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv2Proof" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv2Proof">×</button></div></label>
        <label>3η Αποστολή<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv3Send" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv3Send">×</button></div></label>
        <label>3ο Αποδεικτικό<div style="display:flex;gap:6px;align-items:center"><input type="date" name="d_inv3Proof" style="flex:1"><button type="button" class="btn ghost clear-date" style="padding:4px 8px;font-size:12px" title="Καθαρισμός" data-clear="d_inv3Proof">×</button></div></label>
      </div>
    </details>

    <div class="acts" style="flex-wrap:wrap;gap:8px">
      <button type="button" class="btn ghost" id="btnFormCancel">Άκυρο</button>
      <button type="button" class="btn bad" id="btnFormDelete" hidden>Διαγραφή</button>
      <button type="button" class="btn" id="btnGenInv" title="Κατεβάζει πρόσκληση .doc με τα τρέχοντα στοιχεία της φόρμας">Δημιουργία πρόσκλησης .doc</button>
      <button type="submit" class="btn pri">Αποθήκευση</button>
    </div>
  </form>
</dialog>

<!-- Modal Wizard (Βήμα-Βήμα Ενέργειες) -->
<dialog id="dlgWizard">
  <div class="dlg">
    <h2 id="wT"></h2>
    <p id="wD" class="muted"></p>
    <div id="wB"></div>
    <div class="acts col" id="wA"></div>
  </div>
</dialog>

<!-- Modal Ιστορικού -->
<dialog id="dlgHistory">
  <div class="dlg">
    <h2>Ιστορικό Ενεργειών</h2>
    <div id="histBody" class="hist"></div>
    <div class="acts">
      <button type="button" class="btn ghost" id="btnHistoryClose">Κλείσιμο</button>
    </div>
  </div>
</dialog>

<!-- Επιλογή φίλτρου -->
<dialog id="dlgPick">
  <div class="dlg">
    <h2 id="pickT"></h2>
    <div id="pickB" class="pick"></div>
    <div class="acts"><button type="button" class="btn ghost" onclick="document.getElementById('dlgPick').close()">Κλείσιμο</button></div>
  </div>
</dialog>

<section id="printArea"></section>
<script src="./app.js"></script>
</body>
</html>
