<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Διαχείριση Υποθέσεων</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #f1f5f9; --surface: #ffffff; --ink: #0f172a; --ink2: #334155; --muted: #64748b;
      --line: #e2e8f0; --line2: #cbd5e1; --navy: #0f172a;
      --blue: #1d4ed8; --blue-bg: #dbeafe; --blue-ink: #1e3a8a;
      --orange: #c2410c; --orange-bg: #ffedd5; --orange-ink: #9a3412;
      --red: #b91c1c; --red-bg: #fee2e2; --red-ink: #991b1b;
      --green: #15803d; --green-bg: #dcfce7; --green-ink: #166534;
      --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04);
      --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1);
      --radius: 12px; --radius-sm: 8px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-size: 14.5px; line-height: 1.45; padding-bottom: 70px; }
    button { font: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font: inherit; width: 100%; padding: 10px; border: 1px solid var(--line2); border-radius: var(--radius-sm); background: #f8fafc; color: var(--ink); outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgb(15 23 42 / 0.12); }
    
    /* Header */
    header { background: var(--navy); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 16.5px; font-weight: 700; }
    .top-actions { display: flex; gap: 8px; }
    .btn-top { background: rgba(255,255,255,0.15); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; transition: 0.2s; }
    .btn-top:hover { background: rgba(255,255,255,0.25); }
    
    /* Filters & Search */
    .toolbar { padding: 12px 16px 0; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .search-box { position: relative; }
    .search-box input { padding-left: 36px; background: #fff; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
    .folder-filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    .folder-filters::-webkit-scrollbar { display: none; }
    .f-chip { flex: 0 0 auto; background: #fff; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; transition: 0.2s; }
    .f-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
    .f-chip b { opacity: 0.8; margin-left: 4px; }
    
    /* Banners */
    #banners { max-width: 720px; margin: 10px auto 0; padding: 0 16px; display: grid; gap: 8px; }
    .banner { background: var(--red-bg); color: var(--red-ink); border: 1px solid #fecaca; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; font-weight: 600; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .banner .count { background: var(--red); color: #fff; border-radius: 999px; min-width: 24px; height: 24px; display: grid; place-items: center; font-size: 12px; padding: 0 6px; flex-shrink: 0; }
    
    /* Cards */
    main { padding: 12px 16px 20px; display: grid; gap: 12px; max-width: 720px; margin: 0 auto; }
    .card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--blue); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: 0.2s; display: flex; flex-direction: column; }
    .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .card.st-red { border-left-color: var(--red); background: linear-gradient(90deg, #fef2f2 0%, #fff 30%); }
    .card.st-orange { border-left-color: var(--orange); }
    .card.st-blue { border-left-color: var(--blue); }
    .card.st-green { border-left-color: var(--green); }
    
    .card-main { padding: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .card-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .card-plate { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 4px; background: #f1f5f9; display: inline-block; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px; }
    .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
    
    /* Card Actions & Alerts */
    .card-alert { font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 8px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .card-alert.danger { background: var(--red-bg); color: var(--red-ink); border: 1px solid #fecaca; }
    .card-alert.warn { background: var(--orange-bg); color: var(--orange-ink); border: 1px solid #fed7aa; }
    .card-alert.ok { background: var(--green-bg); color: var(--green-ink); border: 1px solid #bbf7d0; }
    .card-alert::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    
    .action-area { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .btn-primary { background: var(--navy); color: #fff; padding: 12px; border-radius: var(--radius-sm); font-weight: 650; font-size: 13.5px; text-align: center; width: 100%; transition: 0.2s; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.92; }
    .btn-secondary { background: #f8fafc; color: var(--ink2); border: 1px solid var(--line); padding: 10px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; text-align: center; width: 100%; }
    .phone-link { display: block; text-align: center; font-size: 15px; font-weight: 700; color: var(--blue); padding: 10px; border-radius: var(--radius-sm); background: var(--blue-bg); border: 1px solid #bfdbfe; text-decoration: none; margin-bottom: 8px; }
    .cal-link { display: block; text-align: center; font-size: 13px; font-weight: 600; color: var(--blue-ink); padding: 10px; border-radius: var(--radius-sm); background: var(--blue-bg); border: 1px solid #bfdbfe; text-decoration: none; margin-bottom: 8px; }
    
    /* Details */
    .details-toggle { background: none; border: none; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 8px 0 0; cursor: pointer; text-align: left; display: flex; justify-content: space-between; }
    .card-details { display: none; padding: 12px 16px 16px; border-top: 1px solid var(--line); margin-top: 12px; font-size: 13px; color: var(--ink2); }
    .card-details.open { display: block; }
    .detail-row { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; }
    .detail-row span { display: inline-block; }
    .detail-row b { color: var(--muted); font-weight: 600; }
    .detail-notes { background: #f8fafc; border-radius: 6px; padding: 8px; margin-top: 8px; white-space: pre-wrap; }
    .history-btn { background: var(--blue-bg); color: var(--blue-ink); font-weight: 600; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-top: 10px; }
    
    /* FAB & Bottom Bar */
    .fab { position: fixed; bottom: 76px; right: 18px; width: 56px; height: 56px; border-radius: 16px; background: var(--navy); color: #fff; font-size: 28px; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.4); z-index: 40; }
    .bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; padding: 8px 16px; justify-content: center; z-index: 30; }
    .bar button { background: #f1f5f9; color: var(--ink2); padding: 8px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
    
    /* Modals */
    dialog { border: 0; border-radius: 16px; padding: 0; width: min(440px, calc(100% - 24px)); box-shadow: var(--shadow-lg); overflow: hidden; }
    dialog::backdrop { background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(3px); }
    .dlg { padding: 22px; display: flex; flex-direction: column; gap: 16px; max-height: 85vh; overflow-y: auto; }
    .dlg h2 { font-size: 18px; font-weight: 700; }
    .dlg label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .dlg input, .dlg select, .dlg textarea { font: inherit; padding: 10px; border: 1px solid var(--line2); border-radius: var(--radius-sm); background: #f8fafc; width: 100%; }
    .dlg input:focus { border-color: var(--navy); background: #fff; }
    .dlg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dlg-grid .full { grid-column: 1 / -1; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 4px; }
    .btn-cancel { background: #f1f5f9; color: var(--ink2); padding: 10px 16px; border-radius: 8px; font-weight: 600; }
    .btn-ok { background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 650; }
    
    .choice-btns { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-weight: 600; text-align: left; color: var(--ink); transition: 0.2s; }
    .choice-btn:hover { background: #f1f5f9; }
    .choice-btn.danger { border-color: #fecaca; color: var(--red-ink); background: #fef2f2; }
    .choice-btn.success { border-color: #bbf7d0; color: var(--green-ink); background: #f0fdf4; }
    
    /* History Modal */
    .history-item { background: #f8fafc; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .history-item span { font-weight: 600; color: var(--ink2); }
    .history-item time { font-size: 11px; color: var(--muted); font-family: monospace; white-space: nowrap; }
    
    /* Checkbox */
    .check-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .check-row input { width: 18px; height: 18px; accent-color: var(--navy); }
    
    /* Print */
    #printArea { display: none; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff; padding: 0; }
      header, .toolbar, #banners, main, .bar, .fab, dialog { display: none !important; }
      #printArea { display: block !important; font: 8pt Arial, sans-serif; }
      #printArea h1 { font-size: 14pt; margin: 0 0 4mm; border-bottom: 1.5pt solid #000; padding-bottom: 2mm; }
      #printArea table { width: 100%; border-collapse: collapse; }
      #printArea th, #printArea td { border: 1px solid #000; padding: 1.5mm; text-align: left; font-size: 8pt; }
      #printArea th { background: #eee; text-align: center; }
    }
  </style>
</head>
<body>

<header>
  <h1>Διαχείριση Υποθέσεων</h1>
  <div class="top-actions">
    <button class="btn-top" id="btnPrint">Εκτύπωση</button>
    <button class="btn-top" id="btnExport">Backup</button>
    <button class="btn-top" id="btnImport">Επαναφορά</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    <input type="search" id="searchInput" placeholder="Αναζήτηση (όνομα, πινακίδα, φάκελος)..." autocomplete="off">
  </div>
  <div class="folder-filters" id="folderFilters"></div>
</div>

<div id="banners"></div>
<main id="casesList"></main>

<button class="fab" id="btnNew">+</button>
<div class="bar">
  <button id="btnExpBar">Λήψη Backup</button>
  <button id="btnImpBar">Επαναφορά</button>
</div>

<!-- Modal Φόρμας Νέας/Επεξεργασίας Υπόθεσης -->
<dialog id="dlgForm">
  <form class="dlg" id="caseForm">
    <h2 id="formTitle">Νέα Υπόθεση</h2>
    <div class="dlg-grid">
      <label class="full">Πινακίδα Οχήματος *<input name="plate" required placeholder="π.χ. KHK-1234" autocomplete="off" style="text-transform:uppercase"></label>
      <label class="full">Ονοματεπώνυμο *<input name="name" required placeholder="Επώνυμο Όνομα" autocomplete="off"></label>
      <label>Υπηρεσία<input name="service" placeholder="π.χ. Τροχαία"></label>
      <label>Τηλέφωνο<input name="phone" type="tel" placeholder="69xxxxxxxx"></label>
      <label>Ημ. Παραλαβής *<input type="date" name="receivedDate" required></label>
      <label>Θέση Φακέλου<input name="folder" list="folderList" placeholder="π.χ. Ντουλάπι Α"><datalist id="folderList"></datalist></label>
      <label class="full">Είδος Παράβασης
        <select name="violationType" id="fViolationSelect">
          <option value="">— Επιλέξτε —</option>
          <option value="Υπερβολική ταχύτητα">Υπερβολική ταχύτητα</option>
          <option value="ΚΤΕΟ">ΚΤΕΟ</option>
          <option value="Διόδια">Διόδια</option>
          <option value="Στάθμευση">Στάθμευση</option>
          <option value="Απόφαση">Απόφαση</option>
          <option value="custom">Άλλο (ελεύθερο κείμενο)...</option>
        </select>
        <input type="text" name="violationOther" id="fViolationCustom" style="display:none; margin-top:6px" placeholder="Περιγραφή παράβασης...">
      </label>
      <label>Ποσό Προστίμου (€)<input type="number" name="fine" min="0" step="0.01" placeholder="0.00"></label>
      <label class="full"><span class="check-row"><input type="checkbox" name="requiresLicense" id="fReqLicense" checked> Προβλέπεται αφαίρεση διπλώματος</span></label>
      <label id="licenseDaysWrap">Ημέρες Αφαίρεσης<input type="number" name="removalDays" min="1" value="30"></label>
    </div>
    <label class="full">Παρατηρήσεις<textarea name="notes" rows="2" placeholder="Προαιρετικά..."></textarea></label>
    <div class="dlg-actions">
      <button type="button" class="btn-cancel" id="btnFormCancel">Άκυρο</button>
      <button type="button" class="btn-cancel" id="btnFormDelete" style="display:none; color:var(--red-ink)">Διαγραφή</button>
      <button type="submit" class="btn-ok">Αποθήκευση</button>
    </div>
  </form>
</dialog>

<!-- Modal Wizard (Βήμα-Βήμα Ερωτήσεις) -->
<dialog id="dlgWizard">
  <div class="dlg">
    <h2 id="wizardTitle">Ερώτηση</h2>
    <p id="wizardDesc" style="font-size:13.5px; color:var(--muted); margin-top:-8px;"></p>
    <div id="wizardContent"></div>
    <div class="dlg-actions" id="wizardActions" style="justify-content:center;"></div>
  </div>
</dialog>

<!-- Modal Ιστορικού -->
<dialog id="dlgHistory">
  <div class="dlg">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Ιστορικό Ενεργειών</h2>
      <button onclick="document.getElementById('dlgHistory').close()" style="font-size:20px; color:var(--muted);">&times;</button>
    </div>
    <div id="historyContent" style="display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto;"></div>
  </div>
</dialog>

<section id="printArea"></section>

<script>
(() => {
  const KEY = 'troxonomika_final_v10';
  const OLD_KEYS = ['troxonomika_final_v9','troxonomika_final_v8','troxonomika_final_v7','troxonomika_final_v6','troxonomika_final_v5','troxonomika_final_v4','ypotheseis_pwa_v1','ypotheseis.v1','troxonomika.cases.v1','ypotheseis.v2','ypotheseis_gemini_v1'];
  
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  
  // --- DATE UTILS ---
  const todayStr = () => new Date().toISOString().split('T')[0];
  const formatDate = v => v ? new Date(v + 'T12:00:00').toLocaleDateString('el-GR') : '—';
  
  function addDays(dateStr, days) {
    if (!dateStr) return '';
    let d = new Date(dateStr + 'T12:00:00');
    d.setDate(d.getDate() + Number(days));
    const day = d.getDay();
    if (day === 6) d.setDate(d.getDate() + 2); // Σάββατο -> Δευτέρα
    else if (day === 0) d.setDate(d.getDate() + 1); // Κυριακή -> Δευτέρα
    return d.toISOString().split('T')[0];
  }
  function daysBetween(from, to) {
    if (!from || !to) return null;
    return Math.round((new Date(to+'T12:00:00') - new Date(from+'T12:00:00')) / 86400000);
  }
  function isPast(dateStr) {
    if (!dateStr) return false;
    return new Date(dateStr + 'T12:00:00') < new Date(todayStr() + 'T12:00:00');
  }

  // --- DATA & MIGRATION ---
  let cases = [];
  
  function migrateData() {
    const current = localStorage.getItem(KEY);
    if (current) {
      cases = JSON.parse(current) || [];
      return;
    }
    for (const oldKey of OLD_KEYS) {
      const oldData = localStorage.getItem(oldKey);
      if (!oldData) continue;
      try {
        const arr = JSON.parse(oldData);
        if (!Array.isArray(arr) || !arr.length) continue;
        cases = arr.map(o => migrateCase(o));
        save(); // Αποθήκευση στο νέο KEY
        setTimeout(() => alert(`Επιτυχής μεταφορά ${cases.length} υποθέσεων!`), 500);
        return;
      } catch(e) {}
    }
    cases = [];
  }

  function migrateCase(old) {
    const c = {
      id: old.id || Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      plate: old.plate || old.ref || '',
      name: old.name || old.fullName || '',
      service: old.service || '',
      phone: old.phone || '',
      receivedDate: old.receivedDate || old.dateReceived || todayStr(),
      folder: old.folder || old.folderLocation || '',
      violationType: old.violationType || '',
      fine: old.fine || old.fineAmount || '',
      requiresLicense: old.requiresLicense !== false && old.hasRemoval !== false,
      removalDays: old.removalDays || old.suspDays || 30,
      notes: old.notes || '',
      state: mapOldState(old),
      history: old.history || [{ date: todayStr(), action: 'Μεταφορά από παλιά έκδοση' }],
      dates: {
        phone: old.phoneDate || old.callDate || '',
        appt: old.apptDate || old.appointmentDate || '',
        susp: old.suspDate || old.removalDate || old.arrivedDate || '',
        return: old.returnDate || '',
        inv1Send: old.inv1Send || old.invite1Date || old.invite1 || '',
        inv1Proof: old.inv1Proof || old.proof1 || '',
        inv2Send: old.inv2Send || old.invite2Date || old.invite2 || '',
        inv2Proof: old.inv2Proof || old.proof2 || '',
        inv3Send: old.inv3Send || old.invite3Date || old.invite3 || '',
        inv3Proof: old.inv3Proof || old.proof3 || '',
        closed: old.closedDate || ''
      }
    };
    if (c.dates.susp && c.removalDays && !c.dates.return) c.dates.return = addDays(c.dates.susp, c.removalDays);
    return c;
  }

  function mapOldState(old) {
    const s = (old.status || '').toLowerCase();
    if (s === 'search' || (!old.phone && s === 'new')) return 'search';
    if (s === 'to_call' || (old.phone && s === 'new')) return 'to_call';
    if (s === 'informed' || s === 'called') return 'informed';
    if (s === 'appointment' || s === 'appt') return 'appointment';
    if (s === 'removed' || s === 'suspended') return 'suspended';
    if (s === 'to_return') return 'to_return';
    if (s === 'inv1_sent' || s === 'invite1') return 'inv1_sent';
    if (s === 'inv1_proof') return 'inv2_next';
    if (s === 'inv2_sent' || s === 'invite2') return 'inv2_sent';
    if (s === 'inv2_proof') return 'inv3_next';
    if (s === 'inv3_sent' || s === 'invite3') return 'inv3_sent';
    if (s === 'inv3_proof' || s === 'return_service') return 'return_service';
    if (s === 'closed' || s === 'done') return 'closed';
    return old.phone ? 'to_call' : 'search';
  }

  function save() { localStorage.setItem(KEY, JSON.stringify(cases)); }
  function getCase(id) { return cases.find(x => x.id === id); }

  // --- STATE & UI HELPERS ---
  const ST = {
    search:      { label: 'Προς Αναζήτηση', color: 'blue', alert: 'Εκκρεμεί αναζήτηση τηλεφώνου' },
    to_call:     { label: 'Προς Κλήση', color: 'blue', alert: '' },
    informed:    { label: 'Ενημερώθηκε', color: 'orange', alert: '' },
    appointment: { label: 'Κλεισμένο Ραντεβού', color: 'blue', alert: '' },
    no_show:     { label: 'Μη Προσέλευση', color: 'red', alert: 'Δεν προσήλθε στο ραντεβού' },
    suspended:   { label: 'Σε Αφαίρεση', color: 'blue', alert: '' },
    to_return:   { label: 'Προς Απόδοση', color: 'red', alert: 'Έληξε η αφαίρεση!' },
    inv1_next:   { label: 'Προς 1η Πρόσκληση', color: 'orange', alert: 'Αποστολή 1ης Πρόσκλησης' },
    inv1_sent:   { label: 'Αναμονή 1ου Αποδεικτικού', color: 'orange', alert: '' },
    inv2_next:   { label: 'Προς 2η Πρόσκληση', color: 'orange', alert: 'Αποστολή 2ης Πρόσκλησης' },
    inv2_sent:   { label: 'Αναμονή 2ου Αποδεικτικού', color: 'orange', alert: '' },
    inv3_next:   { label: 'Προς 3η Πρόσκληση', color: 'orange', alert: 'Αποστολή 3ης Πρόσκλησης' },
    inv3_sent:   { label: 'Αναμονή 3ου Αποδεικτικού', color: 'orange', alert: '' },
    return_service: { label: 'Επιστροφή στην Υπηρεσία', color: 'red', alert: 'Αποστολή φακέλου στην υπηρεσία' },
    closed:      { label: 'Ολοκληρωμένη', color: 'green', alert: '' }
  };

  function getPrimaryAction(c) {
    switch (c.state) {
      case 'search': return { label: 'Αναζήτηση Τηλεφώνου', action: () => actSearch(c) };
      case 'to_call': return { label: 'Καταχώρηση Κλήσης', action: () => actCall(c) };
      case 'informed': return { label: isPast(addDays(c.dates.phone, 5)) ? 'Αποστολή 1ης' : 'Κλείσιμο Ραντεβού', action: () => isPast(addDays(c.dates.phone, 5)) ? actSendInvite(c, 1) : actSetAppt(c) };
      case 'appointment': return { label: 'Πραγματοποιήθηκε Αφαίρεση', action: () => actRemoval(c) };
      case 'no_show': return { label: 'Αποστολή 1ης Πρόσκλησης', action: () => actSendInvite(c, 1) };
      case 'to_return': return { label: 'Απόδοση Διπλώματος', action: () => actDeliver(c) };
      case 'inv1_next': return { label: 'Αποστολή 1ης', action: () => actSendInvite(c, 1) };
      case 'inv1_sent': return { label: 'Ήρθε Αποδεικτικό 1ης', action: () => actProof(c, 1) };
      case 'inv2_next': return { label: 'Αποστολή 2ης', action: () => actSendInvite(c, 2) };
      case 'inv2_sent': return { label: 'Ήρθε Αποδεικτικό 2ης', action: () => actProof(c, 2) };
      case 'inv3_next': return { label: 'Αποστολή 3ης', action: () => actSendInvite(c, 3) };
      case 'inv3_sent': return { label: 'Ήρθε Αποδεικτικό 3ης', action: () => actProof(c, 3) };
      case 'return_service': return { label: 'Επιστροφή στην Υπηρεσία', action: () => actClose(c) };
      default: return null;
    }
  }

  function setState(id, newState, extra = {}, logMsg = '') {
    const c = getCase(id);
    if (!c) return;
    c.state = newState;
    Object.assign(c.dates, extra);
    if (logMsg) c.history.push({ date: todayStr(), action: logMsg });
    
    // Αυτόματος υπολογισμός returnDate κατά την αφαίρεση
    if (newState === 'suspended' && c.dates.susp && c.removalDays) {
      c.dates.return = addDays(c.dates.susp, c.removalDays);
    }
    
    save(); render();
  }

  // --- WIZARD & FLOW ACTIONS ---
  function openWizard(title, desc, buttons) {
    $('#wizardTitle').textContent = title;
    $('#wizardDesc').textContent = desc || '';
    $('#wizardContent').innerHTML = '';
    const actEl = $('#wizardActions');
    actEl.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn ' + (b.cls || '');
      btn.textContent = b.label;
      btn.onclick = () => { $('#dlgWizard').close(); b.fn(); };
      actEl.appendChild(btn);
    });
    $('#dlgWizard').showModal();
  }

  function openDatePrompt(title, desc, callback) {
    $('#wizardTitle').textContent = title;
    $('#wizardDesc').textContent = desc;
    $('#wizardContent').innerHTML = `<input type="date" id="wizDateVal" value="${todayStr()}" style="text-align:center; font-size:16px;">`;
    $('#wizardActions').innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'btn-ok'; btn.textContent = 'Αποθήκευση';
    btn.onclick = () => { const val = $('#wizDateVal').value; $('#dlgWizard').close(); if (val) callback(val); };
    $('#wizardActions').appendChild(btn);
    $('#dlgWizard').showModal();
  }

  function actSearch(c) {
    openWizard('Αναζήτηση Τηλεφώνου', 'Βρέθηκε τηλέφωνο;', [
      { label: 'Όχι – Δεν βρέθηκε', cls: 'danger', fn: () => setState(c.id, 'inv1_next', {}, 'Δεν βρέθηκε τηλέφωνο -> Μετάβαση σε Πρόσκληση') },
      { label: 'Ναι', cls: 'success', fn: () => {
          $('#wizardTitle').textContent = 'Εισαγωγή Τηλεφώνου';
          $('#wizardDesc').textContent = 'Πληκτρολογήστε τον αριθμό:';
          $('#wizardContent').innerHTML = `<input type="tel" id="wizPhone" style="text-align:center; font-size:16px;">`;
          $('#wizardActions').innerHTML = '';
          const btn = document.createElement('button');
          btn.className = 'btn-ok'; btn.textContent = 'Αποθήκευση';
          btn.onclick = () => {
            const ph = $('#wizPhone').value.trim();
            if (ph) { $('#dlgWizard').close(); setState(c.id, 'to_call', { phone: ph }, `Καταχώρηση τηλεφώνου: ${ph}`); }
          };
          $('#wizardActions').appendChild(btn);
          $('#dlgWizard').showModal();
      }}
    ]);
  }

  function actCall(c) {
    openWizard('Καταχώρηση Κλήσης', 'Απάντησε ο πολίτης;', [
      { label: 'Όχι', cls: 'danger', fn: () => setState(c.id, 'inv1_next', {}, 'Κλήση χωρίς απάντηση -> Μετάβαση σε Πρόσκληση') },
      { label: 'Ναι', cls: 'success', fn: () => {
          openWizard('Ραντεβού', 'Έκλεισε ραντεβού;', [
            { label: 'Όχι – Ενημερώθηκε (Αναμονή 5 ημερών)', cls: 'danger', fn: () => setState(c.id, 'informed', { phone: todayStr() }, 'Ενημερώθηκε, δεν έκλεισε ραντεβού. Αναμονή 5 ημερών.') },
            { label: 'Ναι', cls: 'success', fn: () => openDatePrompt('Ημερομηνία Ραντεβού', 'Επιλέξτε ημερομηνία:', (val) => setState(c.id, 'appointment', { appt: val, phone: c.dates.phone || todayStr() }, `Κλείσιμο ραντεβού για: ${val}`)) }
          ]);
      }}
    ]);
  }

  function actSetAppt(c) { openDatePrompt('Κλείσιμο Ραντεβού', 'Ημερομηνία ραντεβού:', (val) => setState(c.id, 'appointment', { appt: val }, `Νέο ραντεβού: ${val}`)); }
  
  function actRemoval(c) { openDatePrompt('Πραγματοποιήθηκε Αφαίρεση', 'Ημερομηνία αφαίρεσης:', (val) => setState(c.id, 'suspended', { susp: val }, `Αφαίρεση διπλώματος στις ${val}. Λήγει: ${addDays(val, c.removalDays)}`)); }
  
  function actDeliver(c) { openDatePrompt('Απόδοση Διπλώματος', 'Ημερομηνία απόδοσης:', (val) => setState(c.id, 'closed', { closed: val }, `Απόδοση διπλώματος και οριστικό κλείσιμο στις ${val}`)); }
  
  function actClose(c) { setState(c.id, 'closed', { closed: todayStr() }, 'Επιστροφή στην υπηρεσία και κλείσιμο'); }
  
  function actSendInvite(c, n) {
    const field = n === 1 ? 'inv1Send' : n === 2 ? 'inv2Send' : 'inv3Send';
    const nextState = n === 1 ? 'inv1_sent' : n === 2 ? 'inv2_sent' : 'inv3_sent';
    setState(c.id, nextState, { [field]: todayStr() }, `Αποστολή ${n}ης Πρόσκλησης`);
  }

  function actProof(c, n) {
    openDatePrompt(`Αποδεικτικό ${n}ης`, 'Ημερομηνία παραλαβής:', (val) => {
      const field = n === 1 ? 'inv1Proof' : n === 2 ? 'inv2Proof' : 'inv3Proof';
      const nextState = n === 1 ? 'inv2_next' : n === 2 ? 'inv3_next' : 'return_service';
      setState(c.id, nextState, { [field]: val }, `Παραλαβή αποδεικτικού ${n}ης στις ${val}`);
    });
  }

  // --- RENDER ---
  let folderFilter = 'all', q = '';
  
  function render() {
    cases.forEach(c => {
      // Auto-state update for informed -> inv1_next
      if (c.state === 'informed' && isPast(addDays(c.dates.phone, 5))) c.state = 'inv1_next';
      // Auto-state update for appointment -> no_show
      if (c.state === 'appointment' && isPast(addDays(c.dates.appt, 5))) c.state = 'no_show';
      // Auto-state update for suspended -> to_return
      if (c.state === 'suspended' && c.dates.return && isPast(c.dates.return)) c.state = 'to_return';
    });
    save();

    // Folders
    const folderMap = {};
    cases.forEach(c => { const f = c.folder || '(χωρίς φάκελο)'; folderMap[f] = (folderMap[f] || 0) + 1; });
    const fNames = Object.keys(folderMap).sort();
    $('#folderFilters').innerHTML = `<button class="f-chip ${folderFilter==='all'?'active':''}" data-f="all">Όλοι <b>${cases.length}</b></button>` +
      fNames.map(f => `<button class="f-chip ${folderFilter===f?'active':''}" data-f="${f}">${f} <b>${folderMap[f]}</b></button>`).join('');

    // Banners
    const urgent = cases.filter(c => ['no_show','to_return','return_service'].includes(c.state) || (c.state === 'informed' && isPast(addDays(c.dates.phone, 5))));
    if (urgent.length) {
      $('#banners').innerHTML = `<div class="banner" onclick="document.getElementById('searchInput').value=''; document.getElementById('searchInput').dispatchEvent(new Event('input'));"><span class="count">${urgent.length}</span> Επείγουσες Εκκρεμότητες (Κλικ για προβολή)</div>`;
    } else { $('#banners').innerHTML = ''; }

    // Cards
    const filtered = cases.filter(c => {
      if (folderFilter !== 'all' && (c.folder || '(χωρίς φάκελο)') !== folderFilter) return false;
      if (!q) return true;
      return [c.name, c.plate, c.folder, c.phone].join(' ').toLowerCase().includes(q.toLowerCase());
    }).sort((a,b) => {
      const urgA = ['no_show','to_return','return_service'].includes(a.state) ? 1 : 0;
      const urgB = ['no_show','to_return','return_service'].includes(b.state) ? 1 : 0;
      if (urgA !== urgB) return urgB - urgA;
      return (b.receivedDate || '').localeCompare(a.receivedDate || '');
    });

    $('#casesList').innerHTML = filtered.map(c => {
      const st = ST[c.state] || ST.search;
      const isMinimal = ['search','to_call','inv1_next'].includes(c.state);
      let alertHtml = '';
      
      // Critical deadlines
      if (c.state === 'informed') alertHtml = `<div class="card-alert warn">Αναμονή 5 ημερών (${formatDate(addDays(c.dates.phone, 5))})</div>`;
      if (c.state === 'appointment') alertHtml = `<div class="card-alert ok">Ραντεβού: ${formatDate(c.dates.appt)} (Έλεγχος: ${formatDate(addDays(c.dates.appt, 5))})</div>`;
      if (c.state === 'suspended') alertHtml = `<div class="card-alert ok">Σε αφαίρεση (${c.removalDays} ημ.). Λήγει: ${formatDate(c.dates.return)}</div>`;
      if (c.state === 'no_show') alertHtml = `<div class="card-alert danger">Μη προσέλευση στο ραντεβού!</div>`;
      if (c.state === 'to_return') alertHtml = `<div class="card-alert danger">Έληξε η αφαίρεση! Προς Απόδοση.</div>`;
      if (c.state === 'return_service') alertHtml = `<div class="card-alert danger">Επιστροφή στην Υπηρεσία!</div>`;

      let actionHtml = '';
      const act = getPrimaryAction(c);
      if (c.state === 'to_call' && c.phone) actionHtml += `<a href="tel:${c.phone}" class="phone-link">${c.phone}</a>`;
      if (c.state === 'appointment') actionHtml += `<a href="${calLink(c)}" target="_blank" class="cal-link">Προσθήκη στο Google Calendar</a>`;
      if (act) actionHtml += `<button class="btn-primary" data-act="${c.id}">${act.label}</button>`;

      // Details
      const details = [
        c.service ? `<span><b>Υπηρεσία:</b> ${c.service}</span>` : '',
        c.folder ? `<span><b>Φάκελος:</b> ${c.folder}</span>` : '',
        `<span><b>Παραλαβή:</b> ${formatDate(c.receivedDate)}</span>`,
        c.phone && c.state !== 'to_call' ? `<span><b>Τηλ:</b> <a href="tel:${c.phone}" style="color:var(--blue); font-weight:700;">${c.phone}</a></span>` : '',
        c.violationType ? `<span><b>Παράβαση:</b> ${c.violationType}</span>` : '',
        c.fine ? `<span><b>Πρόστιμο:</b> ${c.fine} €</span>` : '',
        c.removalDays ? `<span><b>Ημέρες αφαίρεσης:</b> ${c.removalDays}</span>` : '',
      ].filter(Boolean).join('');

      return `
        <article class="card st-${st.color}" data-id="${c.id}">
          <div class="card-main">
            <div class="card-header">
              <div><div class="card-title">${c.name}</div><div class="card-plate">${c.plate}</div></div>
              <span class="badge" style="background:var(--${st.color}-bg); color:var(--${st.color}-ink);">${st.label}</span>
            </div>
            ${!isMinimal ? alertHtml : `<div style="font-size:13px; color:var(--muted); margin-bottom:8px;">${st.alert}</div>`}
            <div class="action-area">${actionHtml}</div>
            <button class="details-toggle" data-toggle="${c.id}">+ Λεπτομέρειες</button>
          </div>
          <div class="card-details" id="det-${c.id}">
            <div class="detail-row">${details}</div>
            ${c.notes ? `<div class="detail-notes">${c.notes}</div>` : ''}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="btn-secondary" style="flex:1" data-edit="${c.id}">Επεξεργασία</button>
              <button class="history-btn" style="flex:1" data-history="${c.id}">Ιστορικό (${c.history.length})</button>
            </div>
          </div>
        </article>
      `;
    }).join('') || '<div style="text-align:center; padding:40px; color:var(--muted);">Δεν βρέθηκαν υποθέσεις.</div>';

    // Bind Card Events
    $$('[data-act]').forEach(b => b.onclick = e => { e.stopPropagation(); getPrimaryAction(getCase(b.dataset.act)).action(); });
    $$('[data-toggle]').forEach(b => b.onclick = e => { e.stopPropagation(); $(`#det-${b.dataset.toggle}`).classList.toggle('open'); b.textContent = $(`#det-${b.dataset.toggle}`).classList.contains('open') ? '− Απόκρυψη' : '+ Λεπτομέρειες'; });
    $$('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); openForm(b.dataset.edit); });
    $$('[data-history]').forEach(b => b.onclick = e => { e.stopPropagation(); openHistory(b.dataset.history); });

    // Datalist
    const folders = [...new Set(cases.map(c => c.folder).filter(Boolean))].sort();
    $('#folderList').innerHTML = folders.map(f => `<option value="${f}">`).join('');
  }

  function calLink(c) {
    if (!c.dates.appt) return '#';
    const d = c.dates.appt.replace(/-/g,'');
    const title = encodeURIComponent(`Ραντεβού: ${c.name} (${c.plate})`);
    const details = encodeURIComponent(`Τηλ: ${c.phone || '—'} | Φάκελος: ${c.folder || '—'}`);
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}T090000Z/${d}T100000Z&ctz=Europe/Athens&details=${details}`;
  }

  // --- MODALS & FORMS ---
  function openForm(id) {
    const c = id ? getCase(id) : null;
    const f = $('#caseForm');
    f.reset();
    $('#formTitle').textContent = c ? 'Επεξεργασία Υπόθεσης' : 'Νέα Υπόθεση';
    $('#btnFormDelete').style.display = c ? 'block' : 'none';
    
    if (c) {
      f.plate.value = c.plate;
      f.name.value = c.name;
      f.service.value = c.service || '';
      f.phone.value = c.phone || '';
      f.receivedDate.value = c.receivedDate;
      f.folder.value = c.folder || '';
      
      if (['Υπερβολική ταχύτητα', 'ΚΤΕΟ', 'Διόδια', 'Στάθμευση', 'Απόφαση'].includes(c.violationType)) {
        f.violationType.value = c.violationType;
        f.violationOther.value = '';
      } else if (c.violationType) {
        f.violationType.value = 'custom';
        f.violationOther.value = c.violationType;
      } else {
        f.violationType.value = '';
        f.violationOther.value = '';
      }
      
      f.fine.value = c.fine || '';
      f.requiresLicense.checked = c.removalDays > 0;
      f.removalDays.value = c.removalDays || 30;
      f.notes.value = c.notes || '';
    } else {
      f.receivedDate.value = todayStr();
      f.requiresLicense.checked = true;
    }
    
    toggleLicenseFields();
    toggleViolationCustom();
    f.dataset.id = id || '';
    $('#dlgForm').showModal();
  }

  function toggleLicenseFields() { $('#licenseDaysWrap').style.display = $('#fReqLicense').checked ? 'flex' : 'none'; }
  function toggleViolationCustom() { $('#fViolationCustom').style.display = $('#fViolationSelect').value === 'custom' ? 'block' : 'none'; }

  $('#caseForm').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    const id = f.dataset.id || Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const old = getCase(id);
    
    const vType = f.violationType.value === 'custom' ? f.violationOther.value.trim() : f.violationType.value;
    
    const rec = {
      id,
      plate: f.plate.value.trim().toUpperCase(),
      name: f.name.value.trim(),
      service: f.service.value.trim(),
      phone: f.phone.value.trim(),
      receivedDate: f.receivedDate.value,
      folder: f.folder.value.trim(),
      violationType: vType,
      fine: f.fine.value.trim(),
      requiresLicense: f.requiresLicense.checked,
      removalDays: f.requiresLicense.checked ? Number(f.removalDays.value) : 0,
      notes: f.notes.value.trim(),
      state: old ? old.state : (f.phone.value.trim() ? 'to_call' : 'search'),
      history: old ? old.history : [{ date: todayStr(), action: 'Δημιουργία Νέας Υπόθεσης' }],
      dates: old ? old.dates : { phone: '', appt: '', susp: '', return: '', inv1Send: '', inv1Proof: '', inv2Send: '', inv2Proof: '', inv3Send: '', inv3Proof: '', closed: '' }
    };

    if (old) {
      rec.history.push({ date: todayStr(), action: 'Επεξεργασία στοιχείων' });
      const idx = cases.findIndex(x => x.id === id);
      cases[idx] = rec;
    } else {
      cases.unshift(rec);
    }

    save(); render(); $('#dlgForm').close();
  };

  $('#btnFormDelete').onclick = () => {
    if (confirm('Οριστική διαγραφή υπόθεσης;')) {
      const id = $('#caseForm').dataset.id;
      cases = cases.filter(x => x.id !== id);
      save(); render(); $('#dlgForm').close();
    }
  };

  function openHistory(id) {
    const c = getCase(id);
    if (!c) return;
    $('#historyContent').innerHTML = [...c.history].reverse().map(h => `
      <div class="history-item">
        <span>${h.action}</span>
        <time>${formatDate(h.date)}</time>
      </div>
    `).join('');
    $('#dlgHistory').showModal();
  }

  // --- EVENT LISTENERS ---
  $('#btnNew').onclick = () => openForm(null);
  $('#searchInput').oninput = e => { q = e.target.value; render(); };
  $('#btnFormCancel').onclick = () => $('#dlgForm').close();
  $('#fReqLicense').onchange = toggleLicenseFields;
  $('#fViolationSelect').onchange = toggleViolationCustom;
  
  $('#folderFilters').onclick = e => {
    const b = e.target.closest('.f-chip');
    if (b) { folderFilter = b.dataset.f; render(); }
  };

  // Backup
  const exportData = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'}));
    a.download = `ypotheseis_${todayStr()}.json`; a.click();
  };
  $('#btnExport').onclick = exportData;
  $('#btnExpBar').onclick = exportData;
  
  $('#btnImport').onclick = $('#btnImpBar').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const arr = JSON.parse(ev.target.result);
        if (Array.isArray(arr)) {
          if (confirm('Η εισαγωγή θα αντικαταστήσει τις τρέχουσες υποθέσεις. Συνέχεια;')) {
            cases = arr.map(o => migrateCase(o)); // Re-migrate just in case
            save(); render(); alert('Επιτυχής επαναφορά!');
          }
        }
      } catch { alert('Μη έγκυρο αρχείο.'); }
    };
    r.readAsText(file);
  };

  // Print
  $('#btnPrint').onclick = () => {
    let html = `<h1>ΚΑΤΑΣΤΑΣΗ ΥΠΟΘΕΣΕΩΝ</h1><div style="font-size:10px; margin-bottom:10px;">Ημερομηνία: ${formatDate(todayStr())} | Σύνολο: ${cases.length}</div>`;
    html += `<table><thead><tr><th>Α/Α</th><th>Πινακίδα</th><th>Ονοματεπώνυμο</th><th>Τηλέφωνο</th><th>Κατάσταση</th><th>Ραντεβού</th><th>Απόδοση</th><th>Φάκελος</th></tr></thead><tbody>`;
    cases.forEach((c,i) => {
      html += `<tr>
        <td>${i+1}</td>
        <td><b>${c.plate}</b></td>
        <td>${c.name}</td>
        <td>${c.phone || '—'}</td>
        <td>${(ST[c.state]||{}).label || '—'}</td>
        <td>${c.dates.appt ? formatDate(c.dates.appt) : '—'}</td>
        <td>${c.dates.return ? formatDate(c.dates.return) : '—'}</td>
        <td>${c.folder || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    $('#printArea').innerHTML = html;
    window.print();
  };

  // Init
  migrateData();
  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
})();
</script>
</body>
</html>
