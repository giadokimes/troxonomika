<!doctype html>
<html lang="el"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Διαχείριση Υποθέσεων</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css">
</head><body>
<header>
  <h1>Υποθέσεις</h1>
  <div class="top">
    <button id="btnPrint">Εκτύπωση</button>
    <button id="btnExport">Backup</button>
    <button id="btnImport">Επαναφορά</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</header>
<div class="tools">
  <input type="search" id="searchInput" placeholder="Αναζήτηση: όνομα, πινακίδα, τηλέφωνο, φάκελος" autocomplete="off">
  <div class="lbl">Κατάσταση</div><div class="chips" id="stateFilters"></div>
  <div class="lbl">Φάκελος</div><div class="chips" id="folderFilters"></div>
</div>
<div id="banners"></div>
<main id="casesList"></main>
<button class="fab" id="btnNew" aria-label="Νέα υπόθεση">+</button>

<dialog id="dlgForm"><form id="caseForm" class="dlg">
  <h2 id="formTitle">Νέα υπόθεση</h2>
  <div class="grid">
    <label class="full">Πινακίδα *<input name="plate" required autocomplete="off" style="text-transform:uppercase"></label>
    <label class="full">Ονοματεπώνυμο *<input name="name" required autocomplete="off"></label>
    <label>Υπηρεσία<input name="service"></label>
    <label>Τηλέφωνο<input name="phone" type="tel"></label>
    <label>Ημ. παραλαβής *<input type="date" name="receivedDate" required></label>
    <label>Θέση φακέλου<select name="folderSelect" id="fFolder"></select></label>
    <label class="full" id="fFolderCustomWrap" hidden>Νέος φάκελος<input name="folderCustom"></label>
    <label class="full">Είδος παράβασης
      <select name="violationType" id="fViol"><option value="">—</option>
        <option>Υπερβολική ταχύτητα</option><option>ΚΤΕΟ</option><option>Διόδια</option><option>Στάθμευση</option><option>Απόφαση</option>
        <option value="custom">Άλλο...</option></select></label>
    <label class="full" id="fViolCustomWrap" hidden>Περιγραφή<input name="violationOther"></label>
    <label>Πρόστιμο (€)<input type="number" name="fine" min="0" step="0.01"></label>
    <label class="chk"><input type="checkbox" name="requiresLicense" id="fReq" checked> Αφαίρεση διπλώματος</label>
    <label class="full" id="fDaysWrap">Ημέρες αφαίρεσης<input type="number" name="removalDays" min="1" value="30"></label>
    <label class="full">Παρατηρήσεις<textarea name="notes" rows="2"></textarea></label>
  </div>
  <details class="adv"><summary>Προχωρημένη διόρθωση (κατάσταση και ημερομηνίες)</summary>
    <div class="grid">
      <label class="full">Κατάσταση<select name="manualState"></select></label>
      <label>Τηλεφώνημα<input type="date" name="d_phone"></label>
      <label>Ραντεβού<input type="date" name="d_appt"></label>
      <label>Αφαίρεση<input type="date" name="d_susp"></label>
      <label>Απόδοση (αυτόματο)<input type="date" name="d_return" readonly></label>
      <label>1η αποστολή<input type="date" name="d_inv1Send"></label>
      <label>1ο αποδεικτικό<input type="date" name="d_inv1Proof"></label>
      <label>2η αποστολή<input type="date" name="d_inv2Send"></label>
      <label>2ο αποδεικτικό<input type="date" name="d_inv2Proof"></label>
      <label>3η αποστολή<input type="date" name="d_inv3Send"></label>
      <label>3ο αποδεικτικό<input type="date" name="d_inv3Proof"></label>
    </div>
  </details>
  <div class="acts">
    <button type="button" class="btn ghost" id="btnFormCancel">Άκυρο</button>
    <button type="button" class="btn bad" id="btnFormDelete" hidden>Διαγραφή</button>
    <button type="submit" class="btn pri">Αποθήκευση</button>
  </div>
</form></dialog>

<dialog id="dlgWizard"><div class="dlg">
  <h2 id="wT"></h2><p id="wD" class="muted"></p><div id="wB"></div><div class="acts col" id="wA"></div>
</div></dialog>

<dialog id="dlgHistory"><div class="dlg">
  <h2>Ιστορικό ενεργειών</h2><div id="histBody" class="hist"></div>
  <div class="acts"><button class="btn ghost" id="btnHistoryClose">Κλείσιμο</button></div>
</div></dialog>

<section id="printArea"></section>
<script src="./app.js"></script>
</body></html>
